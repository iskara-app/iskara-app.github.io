<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iskara</title>
<meta name="description" content="每天一個問題，寫給自己。記下當時的你 —— 不上傳、沒有讚、只有你看得到。">
<meta property="og:title" content="Iskara">
<meta property="og:description" content="每天一個問題，寫給自己。記下當時的你。">
<meta property="og:type" content="website">
<style>
  :root { --bg:#fdfdfb; --fg:#1c1c1e; --muted:#6b6b70; --rule:#e5e5e0; --accent:#A16B00;
          --btn:#1c1c1e; --btn-fg:#ffffff; --shadow:0 12px 40px rgba(20,22,28,.14); }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161c; --fg:#eceef2; --muted:#9a9ca5; --rule:#2a2d36; --accent:#F0A947;
            --btn:#eceef2; --btn-fg:#14161c; --shadow:0 12px 40px rgba(0,0,0,.5); }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:3.5rem 1.25rem 4rem; background:var(--bg); color:var(--fg);
         font:16px/1.75 -apple-system, "PingFang TC", "Noto Sans TC", sans-serif;
         -webkit-font-smoothing:antialiased; }
  main { max-width: 32rem; margin: 0 auto; }

  .hero { text-align:center; }
  .emblem { width:120px; height:auto; margin:0 auto 1.75rem; display:block;
            filter: drop-shadow(0 10px 26px rgba(0,0,0,.30)); }
  h1 { font-size:2rem; margin:0 0 .5rem; letter-spacing:.03em; font-weight:600; }
  .tagline { font-size:1.4rem; line-height:1.6; margin:0 auto .75rem; max-width:22rem;
             font-family: Georgia, "Songti TC", "Noto Serif TC", serif; }
  .sub { color:var(--muted); font-size:1.02rem; margin:0 auto 2.25rem; max-width:21rem; }

  .cta { display:inline-flex; align-items:center; justify-content:center; text-decoration:none;
         background:var(--btn); color:var(--btn-fg); font-size:1.05rem; font-weight:600;
         padding:.9rem 2rem; border-radius:999px; }
  .cta:active { opacity:.85; }
  .note { color:var(--muted); font-size:.85rem; margin:1rem 0 0; }
  .soon { display:inline-flex; align-items:center; gap:.45rem; margin-top:1.25rem;
          color:var(--muted); font-size:.88rem; text-decoration:none;
          border:1px solid var(--rule); border-radius:999px; padding:.45rem 1.1rem; }
  .soon:active { opacity:.7; }
  .soon .dot { width:.5rem; height:.5rem; border-radius:999px; background:var(--accent);
               opacity:.7; }

  .shots { display:flex; justify-content:center; gap:3.5%; margin:3.5rem 0 1rem; }
  .shots img { width:48%; max-width:230px; height:auto; border-radius:18px;
               box-shadow:var(--shadow); }

  .why { margin:3rem 0 0; }
  .why h2 { font-size:1.05rem; margin:0 0 1rem; color:var(--muted); font-weight:600;
            text-align:center; letter-spacing:.02em; }
  .why ul { list-style:none; padding:0; margin:0; max-width:26rem; margin-inline:auto; }
  .why li { padding:.9rem 0; border-top:1px solid var(--rule); font-size:1.05rem; }
  .why li:first-child { border-top:0; }
  .why b { font-weight:600; }
  .why span { display:block; color:var(--muted); font-size:.92rem; margin-top:.15rem; }

  .cta-row { text-align:center; margin:3rem 0 0; }

  nav { margin-top:3.5rem; padding-top:1.5rem; border-top:1px solid var(--rule);
        text-align:center; }
  nav a { color:var(--accent); text-decoration:none; margin:0 .75rem; font-size:.95rem; }
  footer { margin-top:1.5rem; color:var(--muted); font-size:.85rem; text-align:center; }
  footer a { color:var(--accent); }
</style>
</head>
<body>
<main>

<section class="hero">

  <svg class="emblem" viewBox="0 0 120 160" aria-hidden="true">
    <defs>

        <stop offset="0" stop-color="#2B3052"/>
        <stop offset="1" stop-color="#171A2B"/>
      </linearGradient>
      <radialGradient id="spark" cx="50%" cy="50%" r="50%">
        <stop offset="0" stop-color="#FFFFFF"/>
        <stop offset="55%" stop-color="#F0A847"/>
        <stop offset="100%" stop-color="#C97F1F"/>
      </radialGradient>
      <radialGradient id="glow" cx="50%" cy="50%" r="50%">
        <stop offset="0" stop-color="#F0A847" stop-opacity="0.45"/>
        <stop offset="100%" stop-color="#F0A847" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="refl" cx="50%" cy="50%" r="50%">
        <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
        <stop offset="45%" stop-color="#F0A847" stop-opacity="0.12"/>
        <stop offset="100%" stop-color="#F0A847" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect x="1" y="1" width="118" height="158" rx="18" fill="url(#sky)"/>
    <rect x="9" y="9" width="102" height="142" rx="12" fill="none" stroke="#F0A847" stroke-opacity="0.30" stroke-width="1"/>
    <rect x="14" y="14" width="92" height="132" rx="9" fill="none" stroke="#F0A847" stroke-opacity="0.13" stroke-width="0.75"/>
    <circle cx="60" cy="57.6" r="33" fill="url(#glow)"/>
    <ellipse cx="60" cy="87.6" rx="40" ry="5.5" fill="url(#refl)"/>
    <g fill="#F7F0E3">
      <rect x="52" y="96" width="16" height="2" rx="1" opacity="0.16"/>
      <rect x="45" y="105" width="30" height="2.2" rx="1.1" opacity="0.12"/>
      <rect x="50" y="114" width="20" height="2" rx="1" opacity="0.08"/>
    </g>
    <g transform="translate(30,27.6) scale(0.6)">
      <path d="M100,50 L57.39,53.06 L63.43,63.43 L53.06,57.39 L50,100 L46.94,57.39 L36.57,63.43 L42.61,53.06 L0,50 L42.61,46.94 L36.57,36.57 L46.94,42.61 L50,0 L53.06,42.61 L63.43,36.57 L57.39,46.94 Z" fill="url(#spark)"/>
    </g>
    <rect x="1" y="1" width="118" height="158" rx="18" fill="none" stroke="#F7F0E3" stroke-opacity="0.40" stroke-width="1.5"/>
  </svg>

  <h1>Iskara</h1>
  <p class="tagline">每天一個問題，寫給自己。</p>

</section>

<section class="shots">

<section class="why">
  <h2>這是什麼</h2>
  <ul>
    <li><b>每天一個問題</b><span>不用面對空白頁，打開就有一題可以想。</span></li>

    <li><b>只寫給自己</b><span>不上傳、沒有讚、沒有追蹤，只有你看得到。</span></li>
  </ul>
