<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iskara</title>
<meta name="description" content="每天一個問題，寫給自己。記下當時的你 —— 不上傳、沒有讚、只有你看得到。">
<meta property="og:title" content="Iskara">
<meta property="og:description" content="每天一個問題，寫給自己。記下當時的你。">
<meta property="og:type" content="website">
<style>
  :root { --bg:#fdfdfb; --fg:#1c1c1e; --muted:#6b6b70; --rule:#e5e5e0; --accent:#A16B00;
          --btn:#1c1c1e; --btn-fg:#ffffff; --shadow:0 12px 40px rgba(20,22,28,.14); }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161c; --fg:#eceef2; --muted:#9a9ca5; --rule:#2a2d36; --accent:#F0A947;
            --btn:#eceef2; --btn-fg:#14161c; --shadow:0 12px 40px rgba(0,0,0,.5); }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:3.5rem 1.25rem 4rem; background:var(--bg); color:var(--fg);
         font:16px/1.75 -apple-system, "PingFang TC", "Noto Sans TC", sans-serif;
         -webkit-font-smoothing:antialiased; }
  main { max-width: 32rem; margin: 0 auto; }

  .hero { text-align:center; }
  .star { width:104px; height:104px; margin:0 auto 1.5rem; display:block; }
  h1 { font-size:2rem; margin:0 0 .5rem; letter-spacing:.03em; font-weight:600; }
  .tagline { font-size:1.4rem; line-height:1.6; margin:0 auto .75rem; max-width:22rem;
             font-family: Georgia, "Songti TC", "Noto Serif TC", serif; }
  .sub { color:var(--muted); font-size:1.02rem; margin:0 auto 2.25rem; max-width:21rem; }

  .badge-link { display:inline-block; }
  .badge-link:active { opacity:.85; }
  .badge { height:52px; width:auto; vertical-align:middle; }
  .badge-dark { display:none; }
  @media (prefers-color-scheme: dark) {
    .badge-light { display:none; }
    .badge-dark { display:inline-block; }
  }
  .note { color:var(--muted); font-size:.85rem; margin:1rem 0 0; }

  .shots { display:flex; justify-content:center; gap:3.5%; margin:3.5rem 0 1rem; }
  .shots img { width:48%; max-width:230px; height:auto; border-radius:18px;
               box-shadow:var(--shadow); }

  .why { margin:3rem 0 0; }
  .why h2 { font-size:1.05rem; margin:0 0 1rem; color:var(--muted); font-weight:600;
            text-align:center; letter-spacing:.02em; }
  .why ul { list-style:none; padding:0; margin:0; max-width:26rem; margin-inline:auto; }
  .why li { padding:.9rem 0; border-top:1px solid var(--rule); font-size:1.05rem; }
  .why li:first-child { border-top:0; }
  .why b { font-weight:600; }
  .why span { display:block; color:var(--muted); font-size:.92rem; margin-top:.15rem; }

  .cta-row { text-align:center; margin:3rem 0 0; }

  nav { margin-top:3.5rem; padding-top:1.5rem; border-top:1px solid var(--rule);
        text-align:center; }
  nav a { color:var(--accent); text-decoration:none; margin:0 .75rem; font-size:.95rem; }
  footer { margin-top:1.5rem; color:var(--muted); font-size:.85rem; text-align:center; }
  footer a { color:var(--accent); }
</style>
</head>
<body>
<main>

<section class="hero">
  <!-- 呼應 App 卡面的星芒（原創幾何） -->
  <svg class="star" viewBox="0 0 100 100" aria-hidden="true">
    <defs>
      <radialGradient id="g" cx="50%" cy="50%" r="55%">
        <stop offset="0%" stop-color="#FFE9B0"/>
        <stop offset="45%" stop-color="#F0A947"/>
        <stop offset="100%" stop-color="#A16B00"/>
      </radialGradient>
    </defs>
    <path d="M50 4 L56 44 L96 50 L56 56 L50 96 L44 56 L4 50 L44 44 Z" fill="url(#g)"/>
    <path d="M50 22 L52.5 47.5 L78 50 L52.5 52.5 L50 78 L47.5 52.5 L22 50 L47.5 47.5 Z" fill="#FFF6E0" opacity=".9"/>
  </svg>

  <h1>Iskara</h1>
  <p class="tagline">每天一個問題，寫給自己。</p>
  <p class="sub">記下當時的你 —— 不上傳、沒有讚、只有你看得到。</p>

  <a class="badge-link" href="https://apps.apple.com/tw/app/iskara/id6804740116?ct=web">
    <img class="badge badge-light" src="/assets/app-store-badge-black.svg" alt="在 App Store 下載" width="141" height="52">
    <img class="badge badge-dark" src="/assets/app-store-badge-white.svg" alt="在 App Store 下載" width="141" height="52">
  </a>
  <p class="note">iPhone · 免費下載，內含選購卡包</p>
</section>

<section class="shots">
  <img src="/assets/cardback.jpg" alt="Iskara 今天的卡片" loading="lazy" width="640" height="1390">
  <img src="/assets/today.jpg" alt="Iskara 寫下今天的答案" loading="lazy" width="640" height="1390">
</section>

<section class="why">
  <h2>這是什麼</h2>
  <ul>
    <li><b>每天一個問題</b><span>不用面對空白頁，打開就有一題可以想。</span></li>
    <li><b>記下當時的你</b><span>過去寫的改不了，那是最誠實的紀錄。</span></li>
    <li><b>只寫給自己</b><span>不上傳、沒有讚、沒有追蹤，只有你看得到。</span></li>
  </ul>
</section>

<div class="cta-row">
  <a class="badge-link" href="https://apps.apple.com/tw/app/iskara/id6804740116?ct=web">
    <img class="badge badge-light" src="/assets/app-store-badge-black.svg" alt="在 App Store 下載" width="141" height="52">
    <img class="badge badge-dark" src="/assets/app-store-badge-white.svg" alt="在 App Store 下載" width="141" height="52">
  </a>
</div>

<nav>
  <a href="/privacy/">隱私政策</a>
  <a href="/support/">支援與常見問題</a>
</nav>

<footer>
  有任何問題請寄到 <a href="mailto:iskara.app@gmail.com">iskara.app@gmail.com</a>。
</footer>

</main>
</body>
</html>
