<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iskara</title>
<style>
  :root { --bg:#fdfdfb; --fg:#1c1c1e; --muted:#6b6b70; --rule:#e5e5e0; --accent:#A16B00; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161c; --fg:#eceef2; --muted:#9a9ca5; --rule:#2a2d36; --accent:#F0A947; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:2.5rem 1.25rem 5rem; background:var(--bg); color:var(--fg);
         font:16px/1.75 -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; }
  main { max-width: 40rem; margin: 0 auto; }
  h1 { font-size:1.6rem; margin:0 0 .25rem; letter-spacing:.01em; }
  .lede { font-size:1.15rem; line-height:1.7; border-left:3px solid var(--accent);
          padding-left:1rem; margin:1.5rem 0 2.5rem; }
  ul { padding-left:1.25rem; }
  li { margin:.35rem 0; }
  a { color:var(--accent); }
  footer { margin-top:3.5rem; padding-top:1.25rem; border-top:1px solid var(--rule);
           color:var(--muted); font-size:.9rem; }
</style>
</head>
<body>
<main>

<h1>Iskara</h1>

<p class="lede">每天一張卡，一個問題。你寫下的字只存在你的手機裡。</p>

<ul>
  <li><a href="/privacy/">隱私政策</a></li>
  <li><a href="/support/">支援與常見問題</a></li>
</ul>

<footer>
  有任何問題請寄到 <a href="mailto:iskara.app@gmail.com">iskara.app@gmail.com</a>。
</footer>

</main>
</body>
</html>
